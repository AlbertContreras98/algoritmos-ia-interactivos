    function updateGraphInfo() {
      const infoDiv = document.getElementById('graphInfo');
      const state = currentExercise;
      let html = '<strong>Grafo actual:</strong><br/>';
      const G = state.graph;
      // Clear any previous visualization
      const vizDiv = document.getElementById('graphViz');
      vizDiv.innerHTML = '';
      // Exercises without a graph or dataset: hide the info panel and visualization
      if (['minimax', 'forward', 'backward', 'decisiontree', 'neural'].includes(state.type)) {
        infoDiv.classList.add('hidden');
        vizDiv.classList.add('hidden');
        return;
      }
      // Otherwise ensure info and viz are visible
      infoDiv.classList.remove('hidden');
      vizDiv.classList.remove('hidden');
      // Handle KNN and K-means separately: show dataset information rather than adjacency or weighted edges
      if (state.type === 'knn') {
        if (state.metric === 'euclidean') {
          html += 'Datos (id: x, y, clase):<br/>';
          state.points.forEach(pt => {
            html += (pt.id + 1) + ': ' + pt.x.toFixed(1) + ', ' + pt.y.toFixed(1) + ', ' + state.classes[pt.id] + '<br/>';
          });
          html += '<br/>Punto de consulta Q: ' + state.query.x.toFixed(1) + ', ' + state.query.y.toFixed(1) + '<br/>';
          html += 'Métrica: Euclídea (distancia en el plano)';
        } else {
          html += 'Datos (id: características, clase):<br/>';
          state.items.forEach(it => {
            const parts = state.featureNames.map(f => f + '=' + it.feats[f]).join(', ');
            html += (it.id + 1) + ': ' + parts + ', ' + state.classes[it.id] + '<br/>';
          });
          const qParts = state.featureNames.map(f => f + '=' + state.query.feats[f]).join(', ');
          html += '<br/>Consulta Q: ' + qParts + '<br/>';
          html += 'Métrica: Hamming (nº de características distintas)';
        }
        infoDiv.innerHTML = html;
        return;
      }
      if (state.type === 'kmeans') {
        html += 'Puntos (id: x, y):<br/>';
        state.points.forEach(pt => {
          html += (pt.id + 1) + ': ' + pt.x.toFixed(2) + ', ' + pt.y.toFixed(2) + '<br/>';
        });
        html += '<br/>Número de clusters (k): ' + state.k;
        infoDiv.innerHTML = html;
        return;
      }
      if (state.type === 'ucs' || state.type === 'greedy' || state.type === 'astar') {
        // Grafo ponderado: mostrar nodos y aristas con numeración 1‑basada para el usuario
        const nodeLabels = Object.keys(G).map(k => parseInt(k) + 1);
        html += 'Nodos: ' + nodeLabels.join(', ') + '<br/>';
        {
          const edges = [];
          const isDirected = state.directed === true;
          for (const u in G) {
            for (const v of G[u]) {
              const uu = Number(u);
              const vv = Number(v);
              if (isDirected) {
                // For directed graphs list every edge separately
                const w = state.weights[`${u}-${v}`];
                edges.push(`${uu + 1} →(${w}) ${vv + 1}`);
              } else {
                // For undirected graphs list each edge once where u < v
                if (uu < vv) {
                  const w = state.weights[`${u}-${v}`] || state.weights[`${v}-${u}`];
                  edges.push(`${uu + 1} --(${w})-- ${vv + 1}`);
                }
              }
            }
          }
          html += 'Aristas con pesos: ' + (edges.length > 0 ? edges.join(', ') : '(ninguna)');
        }
        // Matriz de adyacencia con pesos (mostrando etiquetas 1‑basadas)
        const nodes = Object.keys(G).map(Number).sort((a,b) => a - b);
        html += '<br/><br/><strong>Tabla de adyacencia:</strong><br/>';
        html += '<table>';
        html += '<tr><th></th>' + nodes.map(n => `<th>${n + 1}</th>`).join('') + '</tr>';
        for (const i of nodes) {
          html += '<tr><th>' + (i + 1) + '</th>';
          for (const j of nodes) {
            let val;
            if (i === j) {
              val = 0;
            } else if (G[i].has(j)) {
              // Use directed weight if available, else fall back to reverse
              const key1 = `${i}-${j}`;
              const key2 = `${j}-${i}`;
              val = (state.weights[key1] !== undefined) ? state.weights[key1] : (state.weights[key2] !== undefined ? state.weights[key2] : 1);
            } else {
              val = '∞';
            }
            html += '<td>' + val + '</td>';
          }
          html += '</tr>';
        }
        html += '</table>';
        // Para Greedy y A* mostrar valores heurísticos usando identificadores 1‑basados
        if (state.type === 'greedy' || state.type === 'astar') {
          if (state.heuristics) {
            html += '<br/><br/><strong>Heurísticas (h) al objetivo:</strong><br/>';
            html += '<table>';
            html += '<tr><th>Nodo</th><th>h</th></tr>';
            nodes.forEach(n => {
              html += '<tr><td>' + (n + 1) + '</td><td>' + state.heuristics[n] + '</td></tr>';
            });
            html += '</table>';
          }
        }
        // Dibujar grafo ponderado
        {
          // Draw weighted graph using directedness flag when available
          const opts = {};
          if (state.directed !== undefined) opts.directed = state.directed;
          drawWeightedGraph(G, state.weights, opts);
        }
      }
      infoDiv.innerHTML = html;
    }

    /*                      Decision Tree Exercise (ID3‑like)                */
    /*                                                                      */
    /* This section implements an interactive decision tree exercise.       */
    /* The user is given a dataset with binary attributes (X1, X2, ...).   */
    /* For each variable, the user must count how many instances of class  */
    /* 0 and 1 occur when the variable value is 0 or 1, compute the        */
    /* goodness measure (bondad) as the sum of majorities divided by the   */
    /* total number of instances, and then choose the best variable to     */
    /* split the dataset.  The process repeats recursively on each subset  */
    /* until all subsets are pure or no variables remain.                  */
    /* ===================================================================== */

    /**
     * Generate random decision tree data based on difficulty.
     * The number of variables and instances increases with difficulty.
     * Each variable and class takes values 0 or 1.
     * Returns an object { variables, dataset }.
     */
    function generateDecisionTreeData(difficulty) {
      let numVars, numInstances;
      switch (difficulty) {
        case 'easy':
          numVars = 2; numInstances = 6;
          break;
        case 'medium':
          numVars = 3; numInstances = 8;
          break;
        case 'hard':
          numVars = 4; numInstances = 12;
          break;
        case 'veryhard':
          numVars = 5; numInstances = 16;
          break;
        default:
          numVars = 3; numInstances = 8;
      }
      const variables = [];
      for (let i = 1; i <= numVars; i++) {
        variables.push('X' + i);
      }
      const dataset = [];
      for (let i = 0; i < numInstances; i++) {
        const row = { Clase: Math.random() < 0.5 ? 0 : 1 };
        variables.forEach(v => {
          row[v] = Math.random() < 0.5 ? 0 : 1;
        });
        dataset.push(row);
      }
      return { variables, dataset };
    }

    /**
     * Compute count table and goodness (bondad) for a given variable on a dataset.
     * counts[value][class] gives the number of instances with that value and class.
     * bondad = (majority count in value=0 + majority count in value=1) / total.
     */
    function computeBondadForVar(dataset, varName) {
      const counts = { 0: { 0: 0, 1: 0 }, 1: { 0: 0, 1: 0 } };
      for (const row of dataset) {
        const v = row[varName];
        const c = row.Clase;
        if (counts[v] && counts[v][c] !== undefined) {
          counts[v][c]++;
        }
      }
      const total = dataset.length;
      const majoritySum = Math.max(counts[0][0], counts[0][1]) + Math.max(counts[1][0], counts[1][1]);
      const bondad = total > 0 ? (majoritySum / total) : 0;
      return { counts: counts, bondad: bondad };
    }

    /**
     * Initialise a decision tree exercise.  Generates a dataset and sets up a queue
     * of subsets to process.  Each task in the queue has its own dataset,
     * remaining variables, and path (sequence of splits taken to reach it).
     */
    function initDecisionTree(difficulty) {
      const data = generateDecisionTreeData(difficulty);
      const dataset = data.dataset.map((row, idx) => {
        const newRow = Object.assign({}, row);
        newRow.inst = idx + 1; // 1‑based id for display
        return newRow;
      });
      currentExercise = {
        type: 'decisiontree',
        completed: false,
        queue: [
          {
            dataset: dataset,
            variables: data.variables.slice(),
            path: []
          }
        ],
        tree: {},
        // Record the sequence of splits when the user solves the tree manually.
        // Each entry will contain a copy of the dataset, the variables, detailed
        // counts and bondad values, and the chosen splitting variable.  This
        // history is later displayed so the user can review all steps.
        history: []
      };
      updateGraphInfo();
      renderDecisionTree();
      showExercise();
    }

    /**
     * Render the current decision tree task.  Presents the dataset, allows the
     * user to compute counts and bondad for each variable, and then choose the
     * best variable.  Upon correct selection, the dataset is split and new tasks
     * are appended to the queue for each non‑pure subset.
     */
    function renderDecisionTree() {
      const contentDiv = document.getElementById('algorithmContent');
      const state = currentExercise;
      if (!state || state.type !== 'decisiontree') return;
      contentDiv.innerHTML = '';
      // Completion check
      if (state.queue.length === 0) {
        state.completed = true;
        // When no more tasks remain, either show the manual history of splits or
        // the standard completion message.  The history array is populated
        // when the user chooses variables themselves.  If history exists,
        // displaySolvedDecisionTree will render all intermediate steps.
        if (state.history && state.history.length > 0) {
          displaySolvedDecisionTree(state.history);
        } else {
          const p = document.createElement('p');
          p.innerHTML = '<strong>Ejercicio completado.</strong><br/>Has construido todas las ramas del árbol.';
          contentDiv.appendChild(p);
        }
        return;
      }
      // Current task
      const task = state.queue[0];
      const dataset = task.dataset;
      const variables = task.variables;
      // Leaf check: pure subset or no variables
      const uniqClasses = Array.from(new Set(dataset.map(r => r.Clase)));
      if (uniqClasses.length <= 1 || variables.length === 0) {
        state.queue.shift();
        renderDecisionTree();
        return;
      }
      // Intro text
      const intro = document.createElement('p');
      intro.innerHTML = '<strong>Árbol de decisión</strong><br/>Calcula la bondad para cada variable y elige la mejor variable para dividir.';
      contentDiv.appendChild(intro);
      // Dataset table
      const tbl = document.createElement('table');
      const hdr = document.createElement('tr');
      ['Instancia', 'Clase'].concat(variables).forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        hdr.appendChild(th);
      });
      tbl.appendChild(hdr);
      dataset.forEach(row => {
        const tr = document.createElement('tr');
        const tdInst = document.createElement('td');
        tdInst.textContent = row.inst;
        tr.appendChild(tdInst);
        const tdCls = document.createElement('td');
        tdCls.textContent = row.Clase;
        tr.appendChild(tdCls);
        variables.forEach(v => {
          const td = document.createElement('td');
          td.textContent = row[v];
          tr.appendChild(td);
        });
        tbl.appendChild(tr);
      });
      contentDiv.appendChild(tbl);
      // Container for per‑variable tables
      const varsDiv = document.createElement('div');
      contentDiv.appendChild(varsDiv);
      const varInputs = {};
      const bonds = {};
      variables.forEach(v => {
        const detail = computeBondadForVar(dataset, v);
        bonds[v] = detail.bondad;
        const t = document.createElement('table');
        t.style.marginTop = '10px';
        const caption = document.createElement('caption');
        caption.style.fontWeight = 'bold';
        caption.textContent = v;
        t.appendChild(caption);
        // Header row
        const hr = document.createElement('tr');
        ['Valor', 'Clase 0', 'Clase 1', 'Bondad'].forEach(txt => {
          const th = document.createElement('th');
          th.textContent = txt;
          hr.appendChild(th);
        });
        t.appendChild(hr);
        // Two rows: values 0 and 1
        [0, 1].forEach(val => {
          const tr = document.createElement('tr');
          const tdV = document.createElement('td');
          tdV.textContent = val;
          tr.appendChild(tdV);
          // class0 input
          const td0 = document.createElement('td');
          const inp0 = document.createElement('input');
          inp0.type = 'number'; inp0.min = 0;
          inp0.style.width = '50px';
          td0.appendChild(inp0);
          tr.appendChild(td0);
          // class1 input
          const td1 = document.createElement('td');
          const inp1 = document.createElement('input');
          inp1.type = 'number'; inp1.min = 0;
          inp1.style.width = '50px';
          td1.appendChild(inp1);
          tr.appendChild(td1);
          if (val === 0) {
            // Bondad input on first row
            const tdB = document.createElement('td');
            const inpB = document.createElement('input');
            inpB.type = 'text';
            inpB.placeholder = 'Ej: 0.75';
            inpB.style.width = '70px';
            tdB.appendChild(inpB);
            tr.appendChild(tdB);
            varInputs[v] = { c00: inp0, c01: inp1, b: inpB };
          } else {
            const tdB = document.createElement('td');
            tr.appendChild(tdB);
            if (!varInputs[v]) varInputs[v] = {};
            varInputs[v].c10 = inp0;
            varInputs[v].c11 = inp1;
          }
          t.appendChild(tr);
        });
        varsDiv.appendChild(t);
      });
      // Validate button and message
      const btn = document.createElement('button');
      btn.textContent = 'Comprobar';
      btn.style.marginTop = '10px';
      contentDiv.appendChild(btn);
      const msg = document.createElement('div');
      msg.className = 'message';
      contentDiv.appendChild(msg);
      // Variable selection UI
      const selectDiv = document.createElement('div');
      selectDiv.style.marginTop = '10px';
      selectDiv.style.display = 'none';
      const selLabel = document.createElement('span');
      selLabel.textContent = 'Selecciona la mejor variable: ';
      selectDiv.appendChild(selLabel);
      const sel = document.createElement('select');
      variables.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        sel.appendChild(opt);
      });
      selectDiv.appendChild(sel);
      const selBtn = document.createElement('button');
      selBtn.textContent = 'Elegir';
      selBtn.style.marginLeft = '10px';
      selectDiv.appendChild(selBtn);
      contentDiv.appendChild(selectDiv);

      // Solve button: automatically resuelve el árbol completo
      const solveBtn = document.createElement('button');
      solveBtn.textContent = 'Resolver';
      solveBtn.style.marginLeft = '10px';
      contentDiv.appendChild(solveBtn);
      solveBtn.addEventListener('click', () => {
        // Solve current decision tree completely and display result
        solveDecisionTree();
      });
      // Validation handler
      btn.addEventListener('click', () => {
        msg.textContent = '';
        msg.style.color = '';
        let allCorrect = true;
        // Validate each variable: colour inputs and compute correctness
        variables.forEach(v => {
          const detail = computeBondadForVar(dataset, v);
          const counts = detail.counts;
          const expectedB = detail.bondad;
          const inputs = varInputs[v];
          // c00 (valor 0, clase 0)
          const c00Val = parseInt(inputs.c00.value);
          if (!isNaN(c00Val) && c00Val === counts[0][0]) {
            inputs.c00.style.backgroundColor = '#d4edda';
          } else {
            inputs.c00.style.backgroundColor = '#f8d7da';
            allCorrect = false;
          }
          // c01 (valor 0, clase 1)
          const c01Val = parseInt(inputs.c01.value);
          if (!isNaN(c01Val) && c01Val === counts[0][1]) {
            inputs.c01.style.backgroundColor = '#d4edda';
          } else {
            inputs.c01.style.backgroundColor = '#f8d7da';
            allCorrect = false;
          }
          // c10 (valor 1, clase 0)
          const c10Val = parseInt(inputs.c10.value);
          if (!isNaN(c10Val) && c10Val === counts[1][0]) {
            inputs.c10.style.backgroundColor = '#d4edda';
          } else {
            inputs.c10.style.backgroundColor = '#f8d7da';
            allCorrect = false;
          }
          // c11 (valor 1, clase 1)
          const c11Val = parseInt(inputs.c11.value);
          if (!isNaN(c11Val) && c11Val === counts[1][1]) {
            inputs.c11.style.backgroundColor = '#d4edda';
          } else {
            inputs.c11.style.backgroundColor = '#f8d7da';
            allCorrect = false;
          }
          // Bondad input
          const bVal = parseFloat(inputs.b.value);
          if (!isNaN(bVal) && Math.abs(bVal - expectedB) <= 0.02) {
            inputs.b.style.backgroundColor = '#d4edda';
          } else {
            inputs.b.style.backgroundColor = '#f8d7da';
            allCorrect = false;
          }
        });
        if (!allCorrect) {
          msg.style.color = 'red';
          msg.textContent = 'Hay errores en las tablas o bondades. Revisa tus cálculos.';
          return;
        }
        msg.style.color = 'green';
        msg.textContent = '¡Correcto! Ahora selecciona la mejor variable.';
        selectDiv.style.display = '';
      });
      // Selection handler
      selBtn.addEventListener('click', () => {
        const chosen = sel.value;
        // Any variable with the maximum bondad is a valid choice (ties allowed)
        const bestB = Math.max(...variables.map(v => bonds[v]));
        if (Math.abs(bonds[chosen] - bestB) > 1e-9) {
          msg.style.color = 'red';
          msg.textContent = 'Variable incorrecta. Vuelve a intentarlo.';
          return;
        }
        // The user selected the correct variable.  Record this step for
        // later display by capturing the current dataset and computing
        // counts and bondad for each remaining variable.  This history
        // enables showing all manual steps once the exercise finishes.
        if (state.history) {
          const stepVarDetails = {};
          variables.forEach(v => {
            stepVarDetails[v] = computeBondadForVar(dataset, v);
          });
          const datasetCopy = dataset.map(row => {
            const copy = {};
            for (const key in row) {
              if (Object.prototype.hasOwnProperty.call(row, key)) {
                copy[key] = row[key];
              }
            }
            return copy;
          });
          state.history.push({
            dataset: datasetCopy,
            variables: variables.slice(),
            varDetails: stepVarDetails,
            bestVar: chosen,
            bestBondad: stepVarDetails[chosen] ? stepVarDetails[chosen].bondad : null,
            path: task.path ? task.path.slice() : []
          });
        }
        const remainingVars = variables.filter(x => x !== chosen);
        const subsets = { 0: [], 1: [] };
        dataset.forEach(row => {
          const newRow = Object.assign({}, row);
          const val = newRow[chosen];
          delete newRow[chosen];
          subsets[val].push(newRow);
        });
        state.queue.shift();
        [0, 1].forEach(val => {
          const subData = subsets[val];
          if (subData.length === 0) return;
          const clsSet = new Set(subData.map(r => r.Clase));
          if (clsSet.size <= 1 || remainingVars.length === 0) {
            return;
          }
          state.queue.push({
            dataset: subData,
            variables: remainingVars,
            path: task.path.concat([{ variable: chosen, value: val }])
          });
        });
        renderDecisionTree();
      });
    }

    /**
     * Solve the entire decision tree automatically.  This function repeatedly processes
     * tasks in the decision tree queue, selecting the variable with the highest
     * bondad at each step and splitting the dataset accordingly.  When the queue
     * is exhausted, the exercise is marked completed and the final message is
     * displayed via renderDecisionTree().
     */
    function solveDecisionTree() {
      const state = currentExercise;
      if (!state || state.type !== 'decisiontree') return;
      // We will collect each decision step to show all intermediate stages once solved
      const history = [];
      // Process tasks until the queue is empty
      while (state.queue.length > 0) {
        const task = state.queue.shift();
        const dataset = task.dataset;
        const variables = task.variables;
        // Check purity or no variables left
        const clsSet = new Set(dataset.map(r => r.Clase));
        if (clsSet.size <= 1 || variables.length === 0) {
          // No split to record; skip to next task
          continue;
        }
        // Compute bondad details for each variable
        const varDetails = {};
        variables.forEach(v => {
          varDetails[v] = computeBondadForVar(dataset, v);
        });
        // Select variable with highest bondad
        let bestVar = null;
        let bestB = -1;
        variables.forEach(v => {
          const b = varDetails[v].bondad;
          if (b > bestB) {
            bestB = b;
            bestVar = v;
          }
        });
        if (bestVar === null) {
          // Should not happen, but guard against
          continue;
        }
        // Record this step before altering dataset
        // Make a deep copy of dataset rows to preserve variable for display
        const datasetCopy = dataset.map(row => {
          const newRow = {};
          for (const key in row) {
            if (row.hasOwnProperty(key)) newRow[key] = row[key];
          }
          return newRow;
        });
        history.push({
          dataset: datasetCopy,
          variables: variables.slice(),
          varDetails: varDetails,
          bestVar: bestVar,
          bestBondad: bestB,
          path: task.path.slice()
        });
        // Prepare remaining variables
        const remainingVars = variables.filter(x => x !== bestVar);
        // Partition the dataset by the best variable's values
        const subsets = { 0: [], 1: [] };
        dataset.forEach(row => {
          const val = row[bestVar];
          const newRow = Object.assign({}, row);
          // Remove the chosen variable from the new row
          delete newRow[bestVar];
          subsets[val].push(newRow);
        });
        // Enqueue new tasks for each non‑pure subset that still has variables
        [0, 1].forEach(val => {
          const subData = subsets[val];
          if (subData.length === 0) return;
          const subClsSet = new Set(subData.map(r => r.Clase));
          if (subClsSet.size <= 1 || remainingVars.length === 0) {
            return;
          }
          state.queue.push({
            dataset: subData,
            variables: remainingVars,
            path: task.path.concat([{ variable: bestVar, value: val }])
          });
        });
      }
      // After processing all tasks, display all intermediate steps
      displaySolvedDecisionTree(history);
    }

    /**
     * Display all decision tree steps after the automatic solver has completed.
     * This function renders each dataset and its computed variable tables with counts
     * and bondad values. The variable used for the split in each step is
     * highlighted. After all steps are displayed, a completion message is shown.
     * @param {Array} history Array of step objects collected during solveDecisionTree.
     */
    function displaySolvedDecisionTree(history) {
      const contentDiv = document.getElementById('algorithmContent');
      contentDiv.innerHTML = '';
      if (!history || history.length === 0) {
        // Nothing to show; fallback to final message
        const p = document.createElement('p');
        p.innerHTML = '<strong>Ejercicio completado.</strong><br/>Has construido todas las ramas del árbol.';
        contentDiv.appendChild(p);
        return;
      }
      history.forEach((step, index) => {
        // Step container
        const stepDiv = document.createElement('div');
        stepDiv.style.marginBottom = '20px';
        // Title
        const stepTitle = document.createElement('h4');
        stepTitle.textContent = `Paso ${index + 1} - División por ${step.bestVar}`;
        stepDiv.appendChild(stepTitle);
        // Dataset table
        const dataTbl = document.createElement('table');
        dataTbl.style.marginBottom = '10px';
        const hdr = document.createElement('tr');
        ['Instancia', 'Clase'].concat(step.variables).forEach(h => {
          const th = document.createElement('th');
          th.textContent = h;
          hdr.appendChild(th);
        });
        dataTbl.appendChild(hdr);
        step.dataset.forEach(row => {
          const tr = document.createElement('tr');
          // inst
          const tdInst = document.createElement('td');
          tdInst.textContent = row.inst;
          tr.appendChild(tdInst);
          // clase
          const tdCls = document.createElement('td');
          tdCls.textContent = row.Clase;
          tr.appendChild(tdCls);
          // variables
          step.variables.forEach(v => {
            const td = document.createElement('td');
            // In the copy, some variables might have been removed in later steps; if missing, show '-'
            td.textContent = row.hasOwnProperty(v) ? row[v] : '-';
            tr.appendChild(td);
          });
          dataTbl.appendChild(tr);
        });
        stepDiv.appendChild(dataTbl);
        // Variables tables container
        const varsContainer = document.createElement('div');
        varsContainer.style.display = 'flex';
        varsContainer.style.flexWrap = 'wrap';
        varsContainer.style.gap = '10px';
        step.variables.forEach(v => {
          const detail = step.varDetails[v];
          const counts = detail.counts;
          const bondad = detail.bondad;
          const t = document.createElement('table');
          t.style.borderCollapse = 'collapse';
          t.style.minWidth = '150px';
          // Caption
          const cap = document.createElement('caption');
          cap.style.fontWeight = 'bold';
          cap.textContent = v;
          t.appendChild(cap);
          // Header row
          const hr = document.createElement('tr');
          ['Valor', 'Clase 0', 'Clase 1', 'Bondad'].forEach(txt => {
            const th = document.createElement('th');
            th.textContent = txt;
            hr.appendChild(th);
          });
          t.appendChild(hr);
          // Row for value 0
          const row0 = document.createElement('tr');
          // valor
          const val0 = document.createElement('td'); val0.textContent = '0';
          row0.appendChild(val0);
          // c00
          const c00 = document.createElement('td'); c00.textContent = counts[0][0]; row0.appendChild(c00);
          // c01
          const c01 = document.createElement('td'); c01.textContent = counts[0][1]; row0.appendChild(c01);
          // bondad cell, spans two rows
          const bCell = document.createElement('td');
          bCell.textContent = bondad.toFixed(4);
          bCell.style.verticalAlign = 'middle';
          bCell.style.fontWeight = 'bold';
          bCell.style.textAlign = 'center';
          // Highlight chosen variable
          if (v === step.bestVar) {
            bCell.style.backgroundColor = '#fff3cd';
          }
          bCell.rowSpan = 2;
          row0.appendChild(bCell);
          t.appendChild(row0);
          // Row for value 1
          const row1 = document.createElement('tr');
          const val1 = document.createElement('td'); val1.textContent = '1'; row1.appendChild(val1);
          const c10 = document.createElement('td'); c10.textContent = counts[1][0]; row1.appendChild(c10);
          const c11 = document.createElement('td'); c11.textContent = counts[1][1]; row1.appendChild(c11);
          t.appendChild(row1);
          // If this variable is the chosen one, outline the table
          if (v === step.bestVar) {
            t.style.border = '2px solid #ffc107';
          } else {
            t.style.border = '1px solid #ccc';
          }
          varsContainer.appendChild(t);
        });
        stepDiv.appendChild(varsContainer);
        // Append this step to main content
        contentDiv.appendChild(stepDiv);
      });
      // Completion message
      const endMsg = document.createElement('p');
      endMsg.innerHTML = '<strong>Ejercicio completado.</strong><br/>Has construido todas las ramas del árbol.';
      contentDiv.appendChild(endMsg);
    }

    // End of decision tree section

  </script>

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function(err) {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
