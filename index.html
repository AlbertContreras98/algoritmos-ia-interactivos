    function renderMinimax() {
      const container = document.getElementById('algorithmContent');
      container.innerHTML = '';
      const state = currentExercise;
      // Render interactive minimax game tree instead of a table
      // Compute positions for each node in an inorder layout to determine x and depth
      const positions = {};
      let currentXPos = 0;
      function assignPos(u, depth) {
        if (u === null) return;
        assignPos(state.tree[u].left, depth + 1);
        positions[u] = { xIndex: currentXPos, depth: depth };
        currentXPos++;
        assignPos(state.tree[u].right, depth + 1);
      }
      assignPos(0, 0);
      const numNodes = Object.keys(positions).length;
      const xSpacing = 60;
      const ySpacing = 70;
      const marginX = 20;
      const marginY = 20;
      const width = Math.max(numNodes * xSpacing + marginX * 2, 200);
      const maxDepth = Math.max(...Object.values(positions).map(p => p.depth));
      const height = (maxDepth + 1) * ySpacing + marginY * 2;
      // Create a container div for the tree
      const treeDiv = document.createElement('div');
      treeDiv.style.position = 'relative';
      treeDiv.style.width = width + 'px';
      treeDiv.style.height = height + 'px';
      treeDiv.style.marginBottom = '20px';
      container.appendChild(treeDiv);
      // Draw edges using an SVG layer
      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      svg.style.position = 'absolute';
      svg.style.left = '0';
      svg.style.top = '0';
      // Draw edges
      for (const u in state.tree) {
        const left = state.tree[u].left;
        const right = state.tree[u].right;
        const px = positions[u].xIndex * xSpacing + marginX;
        const py = positions[u].depth * ySpacing + marginY;
        if (left !== null) {
          const cx = positions[left].xIndex * xSpacing + marginX;
          const cy = positions[left].depth * ySpacing + marginY;
          const line = document.createElementNS(svgNS, 'line');
          line.setAttribute('x1', px);
          line.setAttribute('y1', py);
          line.setAttribute('x2', cx);
          line.setAttribute('y2', cy);
          line.setAttribute('stroke', '#555');
          svg.appendChild(line);
        }
        if (right !== null) {
          const cx = positions[right].xIndex * xSpacing + marginX;
          const cy = positions[right].depth * ySpacing + marginY;
          const line = document.createElementNS(svgNS, 'line');
          line.setAttribute('x1', px);
          line.setAttribute('y1', py);
          line.setAttribute('x2', cx);
          line.setAttribute('y2', cy);
          line.setAttribute('stroke', '#555');
          svg.appendChild(line);
        }
      }
      treeDiv.appendChild(svg);
      // Prepare inputs and checkboxes maps for validation later
      const inputs = {};
      const alphaInputs = {};
      const betaInputs = {};
      const checks = {};
      // Determine if the exercise has been completed so we know whether to display
      // interactive inputs or fixed solution values.
      const solved = state.completed === true;
      // Draw nodes as positioned divs
      for (const u in positions) {
        const px = positions[u].xIndex * xSpacing + marginX;
        const py = positions[u].depth * ySpacing + marginY;
        const isLeaf = state.tree[u].left === null && state.tree[u].right === null;
        // Determine if this level is max or min based on depth (root depth 0 = max)
        const isMaxLevel = positions[u].depth % 2 === 0;
        // Node circle
        const nodeDiv = document.createElement('div');
        nodeDiv.style.position = 'absolute';
        nodeDiv.style.left = (px - 16) + 'px';
        nodeDiv.style.top = (py - 16) + 'px';
        nodeDiv.style.width = '32px';
        nodeDiv.style.height = '32px';
        nodeDiv.style.borderRadius = '16px';
        nodeDiv.style.display = 'flex';
        nodeDiv.style.alignItems = 'center';
        nodeDiv.style.justifyContent = 'center';
        nodeDiv.style.color = '#fff';
        // Color leaves as yellow, internal nodes color-coded by level: blue for max, purple for min
        if (isLeaf) {
          nodeDiv.style.backgroundColor = '#ffc107';
        } else {
          nodeDiv.style.backgroundColor = isMaxLevel ? '#17a2b8' : '#6f42c1';
        }
        if (isLeaf) {
          // Show leaf value
          nodeDiv.textContent = state.values[u];
        } else if (solved) {
          // In solved mode, display the computed minimax value directly
          nodeDiv.textContent = state.minimax[u];
          // Also display node type (MAX/MIN) and alpha/beta values
          const alphaBetaDiv = document.createElement('div');
          alphaBetaDiv.style.position = 'absolute';
          alphaBetaDiv.style.left = '-22px';
          alphaBetaDiv.style.top = '-38px';
          alphaBetaDiv.style.display = 'flex';
          alphaBetaDiv.style.alignItems = 'center';
          // Label for MAX or MIN
          const typeSpan = document.createElement('span');
          typeSpan.textContent = isMaxLevel ? 'MAX' : 'MIN';
          typeSpan.style.fontSize = '9px';
          typeSpan.style.fontWeight = 'bold';
          typeSpan.style.marginRight = '2px';
          typeSpan.style.color = '#000';
          alphaBetaDiv.appendChild(typeSpan);
          // Show alpha and beta values
          const abSpan = document.createElement('span');
          const ab = state.alphaBeta[u];
          if (ab) {
            const aVal = (ab.alpha === -Infinity) ? '-inf' : (ab.alpha === Infinity ? '+inf' : ab.alpha);
            const bVal = (ab.beta === -Infinity) ? '-inf' : (ab.beta === Infinity ? '+inf' : ab.beta);
            abSpan.textContent = 'α=' + aVal + ' β=' + bVal;
          } else {
            // Node inside a pruned branch: alpha-beta never visits it
            abSpan.textContent = 'podado';
          }
          abSpan.style.fontSize = '9px';
          abSpan.style.color = '#000';
          alphaBetaDiv.appendChild(abSpan);
          nodeDiv.appendChild(alphaBetaDiv);
        } else {
          // Interactive mode: create input for internal node minimax value
          const inp = document.createElement('input');
          inp.type = 'text';
          inp.style.width = '28px';
          inp.style.height = '24px';
          inp.style.border = 'none';
          inp.style.borderRadius = '3px';
          inp.style.textAlign = 'center';
          inp.style.backgroundColor = '#fff';
          inp.style.color = '#000';
          inp.placeholder = '?';
          inputs[u] = inp;
          nodeDiv.appendChild(inp);
          // Create container for node type (MAX/MIN) and alpha/beta inputs
          const alphaBetaDiv = document.createElement('div');
          alphaBetaDiv.style.position = 'absolute';
          alphaBetaDiv.style.left = '-22px';
          alphaBetaDiv.style.top = '-38px';
          alphaBetaDiv.style.display = 'flex';
          alphaBetaDiv.style.alignItems = 'center';
          // Label for MAX or MIN
          const typeSpan = document.createElement('span');
          typeSpan.textContent = isMaxLevel ? 'MAX' : 'MIN';
          typeSpan.style.fontSize = '9px';
          typeSpan.style.fontWeight = 'bold';
          typeSpan.style.marginRight = '2px';
          typeSpan.style.color = '#000';
          alphaBetaDiv.appendChild(typeSpan);
          // Alpha input
          const alphaInp = document.createElement('input');
          alphaInp.type = 'text';
          alphaInp.style.width = '24px';
          alphaInp.style.height = '18px';
          alphaInp.style.marginRight = '2px';
          alphaInp.style.border = '1px solid #ccc';
          alphaInp.style.borderRadius = '3px';
          alphaInp.style.textAlign = 'center';
          alphaInp.placeholder = 'α';
          // Set default value for alpha as -inf to guide the user
          alphaInp.value = '-inf';
          alphaInputs[u] = alphaInp;
          // Beta input
          const betaInp = document.createElement('input');
          betaInp.type = 'text';
          betaInp.style.width = '24px';
          betaInp.style.height = '18px';
          betaInp.style.border = '1px solid #ccc';
          betaInp.style.borderRadius = '3px';
          betaInp.style.textAlign = 'center';
          betaInp.placeholder = 'β';
          // Set default value for beta as +inf to guide the user
          betaInp.value = '+inf';
          betaInputs[u] = betaInp;
          alphaBetaDiv.appendChild(alphaInp);
          alphaBetaDiv.appendChild(betaInp);
          nodeDiv.appendChild(alphaBetaDiv);
        }
        treeDiv.appendChild(nodeDiv);
        // For leaves, add a checkbox below the node to indicate pruning
        if (isLeaf) {
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.style.position = 'absolute';
          cb.style.left = (px - 8) + 'px';
          cb.style.top = (py + 20) + 'px';
          checks[u] = cb;
          // If solved, mark the pruning and disable interaction
          if (solved) {
            cb.checked = state.pruned[u] === true;
            cb.disabled = true;
          }
          treeDiv.appendChild(cb);
        }
      }
      // Only render interactive controls if the exercise has not been solved yet.
      if (!solved) {
        // Instruction paragraph
        const instr = document.createElement('p');
        instr.textContent = 'Introduce los valores minimax, alfa y beta para los nodos internos y marca las hojas que se podan con poda alfa‑beta. Utiliza "+inf" y "-inf" para representar infinito positivo y negativo. Los nodos internos que alfa‑beta no llega a visitar (dentro de una rama podada) no se corrigen en α/β.';
        container.appendChild(instr);
        const btn = document.createElement('button');
        btn.textContent = 'Enviar';
        container.appendChild(btn);
        const msg = document.createElement('div');
        msg.className = 'message';
        container.appendChild(msg);
        btn.addEventListener('click', () => {
          // Validate minimax values, alpha/beta values and pruned leaves separately
          let minimaxOk = true;
          let alphaBetaOk = true;
          let pruningOk = true;
          // Validate minimax values
          for (const u in state.tree) {
            if (!(state.tree[u].left === null && state.tree[u].right === null)) {
              const valStr = inputs[u].value.trim();
              const num = Number(valStr);
              if (valStr === '' || isNaN(num) || num !== state.minimax[u]) {
                minimaxOk = false;
                break;
              }
            }
          }
          // Validate alpha and beta values for internal nodes
          for (const u in state.tree) {
            if (!(state.tree[u].left === null && state.tree[u].right === null)) {
              const aStr = alphaInputs[u].value.trim();
              const bStr = betaInputs[u].value.trim();
              // Helper to parse user input into numeric value or +/-Infinity
              function parseVal(s) {
                if (s === '' || s === undefined) return NaN;
                const lower = s.toLowerCase();
                // accept +inf, inf, infinito, ∞ as positive infinity
                if (lower === '+inf' || lower === '+∞' || lower === '∞' || lower === 'inf' || lower === 'infinity' || lower === 'infinito') {
                  return Infinity;
                }
                // accept -inf, -∞, -infinito
                if (lower === '-inf' || lower === '-∞' || lower === '-infinity' || lower === '-infinito') {
                  return -Infinity;
                }
                const n = Number(s);
                return isNaN(n) ? NaN : n;
              }
              const aVal = parseVal(aStr);
              const bVal = parseVal(bStr);
              const expected = state.alphaBeta[u];
              // Internal nodes inside a pruned branch are never visited: nothing to check
              if (!expected) continue;
              if (isNaN(aVal) || isNaN(bVal) || aVal !== expected.alpha || bVal !== expected.beta) {
                alphaBetaOk = false;
                break;
              }
            }
          }
          // Validate pruned leaves
          for (const leaf in state.values) {
            const expected = state.pruned[leaf];
            const checked = checks[leaf] ? checks[leaf].checked : false;
            if (checked !== expected) {
              pruningOk = false;
              break;
            }
          }
          // Compose error message if any
          if (!minimaxOk || !alphaBetaOk || !pruningOk) {
            const parts = [];
            if (!minimaxOk) parts.push('los valores minimax');
            if (!alphaBetaOk) parts.push('los valores alfa/β');
            if (!pruningOk) parts.push('la selección de hojas podadas');
            msg.style.color = 'red';
            msg.textContent = 'Hay errores en ' + parts.join(' y ') + '. Revisa tu cálculo.';
            return;
          }
          // If all correct
          msg.style.color = 'green';
          msg.textContent = '¡Correcto! Has completado el ejercicio de minimax y poda alfa‑beta.';
          state.completed = true;
        });
        // Add a solve button to fill in all values and complete the exercise
        const solveBtn = document.createElement('button');
        solveBtn.textContent = 'Resolver';
        solveBtn.style.marginLeft = '10px';
        container.appendChild(solveBtn);
        solveBtn.addEventListener('click', () => {
          // Fill in minimax values for internal nodes
          for (const u in state.tree) {
            const isLeafNode = state.tree[u].left === null && state.tree[u].right === null;
            if (!isLeafNode) {
              const expectedVal = state.minimax[u];
              if (inputs[u]) {
                inputs[u].value = expectedVal;
              }
              // Fill alpha/beta values if available
              const ab = state.alphaBeta[u] || { alpha: '-', beta: '-' }; // '-' = not visited (pruned)
              if (alphaInputs[u]) {
                const aVal = (ab.alpha === -Infinity) ? '-inf' : (ab.alpha === Infinity ? '+inf' : ab.alpha);
                alphaInputs[u].value = aVal;
              }
              if (betaInputs[u]) {
                const bVal = (ab.beta === -Infinity) ? '-inf' : (ab.beta === Infinity ? '+inf' : ab.beta);
                betaInputs[u].value = bVal;
              }
            }
          }
          // Mark pruned leaves according to expected pruning
          for (const leaf in state.values) {
            const expectedPruned = state.pruned[leaf];
            if (checks[leaf]) {
              checks[leaf].checked = expectedPruned;
            }
          }
          state.completed = true;
          renderMinimax();
        });
      } else {
        // Solved state: display completion message
        const done = document.createElement('p');
        done.textContent = 'Ejercicio completado. Genera un nuevo ejercicio para practicar otra vez.';
        done.style.marginTop = '10px';
        container.appendChild(done);
      }
    }

    /**
     * Draw a weighted graph in the visualization area. Nodes are arranged on a
     * circle and edges are drawn as straight lines with their weight shown
     * near the midpoint of the line. This is used for MST exercises so that
     * users can see the weighted structure instead of a text list of edges.
     * @param {Object} G adjacency list mapping node -> Set of neighbours
     * @param {Object} weights mapping "u-v" -> weight for each undirected edge
     */
    function drawWeightedGraph(G, weights, options = {}) {
      // Draw a weighted graph (directed or undirected) using SVG.  If `options.directed`
      // is truthy, arrowheads are drawn to indicate direction.  Highlighted
      // nodes and edges can be specified via `options.usedNodes` and
      // `options.usedEdges` (for directed graphs, usedEdges may contain
      // keys of the form "u-v"; for undirected graphs it may contain
      // unordered "min-max" keys).  Node labels are displayed in 1‑based
      // numbering for user readability.
      const directed = options.directed || false;
      const vizDiv = document.getElementById('graphViz');
      vizDiv.innerHTML = '';
      const nodes = Object.keys(G).map(Number);
      const n = nodes.length;
      if (n === 0) return;
      // Highlight sets
      const usedNodes = options.usedNodes instanceof Set ? options.usedNodes : new Set();
      const usedEdges = options.usedEdges instanceof Set ? options.usedEdges : new Set();
      // Dynamically size canvas based on number of nodes
      const base = 380;
      const extra = Math.max(0, n - 5) * 50;
      const width = base + extra;
      const height = base + extra;
      const cx = width / 2;
      const cy = height / 2;
      const r = Math.min(width, height) * 0.35;
      // Compute positions on a circle
      const pos = {};
      nodes.forEach((node, idx) => {
        const angle = (2 * Math.PI * idx) / n;
        pos[node] = {
          x: cx + r * Math.cos(angle),
          y: cy + r * Math.sin(angle)
        };
      });
      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      if (directed) {
        // For each directed edge u -> v draw a line and an arrowhead
        for (const u of nodes) {
          for (const v of G[u]) {
            const uu = parseInt(u);
            const vv = parseInt(v);
            const line = document.createElementNS(svgNS, 'line');
            line.setAttribute('x1', pos[uu].x);
            line.setAttribute('y1', pos[uu].y);
            line.setAttribute('x2', pos[vv].x);
            line.setAttribute('y2', pos[vv].y);
            // Determine stroke colour and width based on highlight set
            const dirKey = `${uu}-${vv}`;
            const undKey = uu < vv ? `${uu}-${vv}` : `${vv}-${uu}`;
            const edgeUsed = usedEdges.has(dirKey) || usedEdges.has(undKey);
            const strokeColour = edgeUsed ? '#28a745' : '#555';
            line.setAttribute('stroke', strokeColour);
            line.setAttribute('stroke-width', edgeUsed ? '3' : '1');
            line.setAttribute('fill', 'none');
            svg.appendChild(line);
            // Weight label at midpoint with offset
            const midX = (pos[uu].x + pos[vv].x) / 2;
            const midY = (pos[uu].y + pos[vv].y) / 2;
            const dx = pos[vv].x - pos[uu].x;
            const dy = pos[vv].y - pos[uu].y;
            const len = Math.hypot(dx, dy) || 1;
            const offsetX = (dy / len) * 10;
            const offsetY = (-dx / len) * 10;
            const wKey = `${uu}-${vv}`;
            const weight = weights[wKey] !== undefined ? weights[wKey] : weights[`${vv}-${uu}`];
            if (weight !== undefined) {
              const text = document.createElementNS(svgNS, 'text');
              text.setAttribute('x', midX + offsetX);
              text.setAttribute('y', midY + offsetY);
              text.setAttribute('text-anchor', 'middle');
              text.setAttribute('font-size', n > 6 ? '10px' : '12px');
              text.setAttribute('fill', '#000');
              text.textContent = weight;
              svg.appendChild(text);
            }
            // Draw arrowhead manually
            const arrowLength = 16;
            const arrowWidth = 6;
            const nodeRadius = 16;
            const ux = dx / (len || 1);
            const uy = dy / (len || 1);
            // Tip of arrow slightly before the node boundary
            const tipX = pos[vv].x - ux * nodeRadius;
            const tipY = pos[vv].y - uy * nodeRadius;
            const baseX = tipX - ux * arrowLength;
            const baseY = tipY - uy * arrowLength;
            const perpX = -uy;
            const perpY = ux;
            const leftX = baseX + perpX * arrowWidth;
            const leftY = baseY + perpY * arrowWidth;
            const rightX = baseX - perpX * arrowWidth;
            const rightY = baseY - perpY * arrowWidth;
            // Shorten line to base of arrowhead
            line.setAttribute('x2', baseX);
            line.setAttribute('y2', baseY);
            const arrow = document.createElementNS(svgNS, 'polygon');
            arrow.setAttribute('points', `${tipX},${tipY} ${leftX},${leftY} ${rightX},${rightY}`);
            arrow.setAttribute('fill', strokeColour);
            svg.appendChild(arrow);
          }
        }
      } else {
        // Undirected: draw each edge once where uu < vv
        for (const u of nodes) {
          for (const v of G[u]) {
            const uu = parseInt(u);
            const vv = parseInt(v);
            if (uu < vv) {
              const line = document.createElementNS(svgNS, 'line');
              line.setAttribute('x1', pos[uu].x);
              line.setAttribute('y1', pos[uu].y);
              line.setAttribute('x2', pos[vv].x);
              line.setAttribute('y2', pos[vv].y);
              const key = `${uu}-${vv}`;
              const edgeUsed = usedEdges.has(key);
              line.setAttribute('stroke', edgeUsed ? '#28a745' : '#555');
              line.setAttribute('stroke-width', edgeUsed ? '3' : '1');
              svg.appendChild(line);
              // Weight label
              const midX = (pos[uu].x + pos[vv].x) / 2;
              const midY = (pos[uu].y + pos[vv].y) / 2;
              const dx = pos[vv].x - pos[uu].x;
              const dy = pos[vv].y - pos[uu].y;
              const len = Math.hypot(dx, dy) || 1;
              const offsetX = (dy / len) * 10;
              const offsetY = (-dx / len) * 10;
              const wKey = `${uu}-${vv}`;
              const weight = weights[wKey] !== undefined ? weights[wKey] : weights[`${vv}-${uu}`];
              if (weight !== undefined) {
                const text = document.createElementNS(svgNS, 'text');
                text.setAttribute('x', midX + offsetX);
                text.setAttribute('y', midY + offsetY);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('font-size', n > 6 ? '10px' : '12px');
                text.setAttribute('fill', '#000');
                text.textContent = weight;
                svg.appendChild(text);
              }
            }
          }
        }
      }
      // Draw nodes and labels
      for (const node of nodes) {
        const circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('cx', pos[node].x);
        circle.setAttribute('cy', pos[node].y);
        circle.setAttribute('r', 16);
        const nodeUsed = usedNodes.has(node);
        circle.setAttribute('fill', nodeUsed ? '#17a2b8' : '#007BFF');
        circle.setAttribute('stroke', '#fff');
        svg.appendChild(circle);
        const text = document.createElementNS(svgNS, 'text');
        text.setAttribute('x', pos[node].x);
        text.setAttribute('y', pos[node].y + 5);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', '12px');
        text.setAttribute('fill', '#fff');
        // Use 1-based numbering
        text.textContent = Number(node) + 1;
        svg.appendChild(text);
      }
      vizDiv.appendChild(svg);
    }

    /**
     * Draw a scatter plot for KNN and K-means algorithms.  Points are drawn as
     * circles positioned according to their x/y coordinates.  For KNN, points
     * are coloured by their class (if provided) and the query point is drawn
     * as a red star.  For K-means, centroids are drawn as squares and points
     * are optionally coloured by their assigned cluster.
     *
     * @param {Array} points array of objects {id, x, y}
     * @param {Object} options optional settings:
     *    - classes: mapping id -> class label for KNN (values used only for colouring)
     *    - assignments: mapping id -> cluster index for K-means colouring
     *    - centroids: array of centroid objects {x, y, index}
     *    - query: object {x, y}
     */
    function drawScatter(points, options = {}) {
      const vizDiv = document.getElementById('graphViz');
      vizDiv.innerHTML = '';
      if (!points || points.length === 0) return;
      // Determine canvas size based on number of points and presence of centroids
      const total = points.length + (options.centroids ? options.centroids.length : 0) + (options.query ? 1 : 0);
      const baseSize = 380;
      const extraSize = Math.max(0, total - 5) * 30;
      const width = baseSize + extraSize;
      const height = baseSize + extraSize;
      // Compute bounds of data
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of points) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      if (options.centroids) {
        for (const c of options.centroids) {
          if (c.x < minX) minX = c.x;
          if (c.x > maxX) maxX = c.x;
          if (c.y < minY) minY = c.y;
          if (c.y > maxY) maxY = c.y;
        }
      }
      if (options.query) {
        const q = options.query;
        if (q.x < minX) minX = q.x;
        if (q.x > maxX) maxX = q.x;
        if (q.y < minY) minY = q.y;
        if (q.y > maxY) maxY = q.y;
      }
      // Add small padding
      const padding = 1;
      minX -= padding;
      maxX += padding;
      minY -= padding;
      maxY += padding;
      // Scaling factors to map data to [20,width-20] and [20,height-20]
      const margin = 40;
      const scaleX = (width - 2 * margin) / (maxX - minX || 1);
      const scaleY = (height - 2 * margin) / (maxY - minY || 1);
      function toSvgX(x) {
        return margin + (x - minX) * scaleX;
      }
      function toSvgY(y) {
        // Invert y-axis so that larger y values appear lower in SVG
        return height - margin - (y - minY) * scaleY;
      }
      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      svg.setAttribute('style', 'border:1px solid #ccc; border-radius:4px; background-color:#fafafa');
      // Define colours for classes/clusters
      const palette = ['#007BFF', '#28A745', '#FFC107', '#E83E8C', '#17A2B8'];
      // Draw points
      for (const p of points) {
        const cx = toSvgX(p.x);
        const cy = toSvgY(p.y);
        const circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('cx', cx);
        circle.setAttribute('cy', cy);
        circle.setAttribute('r', 8);
        let colour = '#007BFF';
        // Colour by class (KNN) or assignment (K-means)
        if (options.assignments && options.assignments[p.id] !== undefined) {
          const cluster = options.assignments[p.id];
          colour = palette[cluster % palette.length];
        } else if (options.classes && options.classes[p.id] !== undefined) {
          const cls = options.classes[p.id];
          // Map unique class labels to palette positions
          const classList = Object.values(options.classes).filter((v, idx, arr) => arr.indexOf(v) === idx);
          const idx = classList.indexOf(cls);
          colour = palette[idx % palette.length];
        }
        circle.setAttribute('fill', colour);
        circle.setAttribute('stroke', '#333');
        svg.appendChild(circle);
        // Label with point id
        const text = document.createElementNS(svgNS, 'text');
        text.setAttribute('x', cx);
        text.setAttribute('y', cy - 12);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', '12px');
        text.setAttribute('fill', '#000');
        text.textContent = p.id + 1; // 1-based label
        svg.appendChild(text);
      }
      // Draw query point as red star for KNN
      if (options.query) {
        const qx = toSvgX(options.query.x);
        const qy = toSvgY(options.query.y);
        // Draw a red circle with thicker border to denote query
        const qCircle = document.createElementNS(svgNS, 'circle');
        qCircle.setAttribute('cx', qx);
        qCircle.setAttribute('cy', qy);
        qCircle.setAttribute('r', 10);
        qCircle.setAttribute('fill', 'none');
        qCircle.setAttribute('stroke', '#dc3545');
        qCircle.setAttribute('stroke-width', '3');
        svg.appendChild(qCircle);
      }
      // Draw centroids as squares for K-means
      if (options.centroids) {
        options.centroids.forEach((c, idx) => {
          const x = toSvgX(c.x);
          const y = toSvgY(c.y);
          const rect = document.createElementNS(svgNS, 'rect');
          rect.setAttribute('x', x - 10);
          rect.setAttribute('y', y - 10);
          rect.setAttribute('width', 20);
          rect.setAttribute('height', 20);
          const colour = palette[idx % palette.length];
          rect.setAttribute('fill', colour);
          rect.setAttribute('stroke', '#333');
          svg.appendChild(rect);
          // label centroid
          const t = document.createElementNS(svgNS, 'text');
          t.setAttribute('x', x);
          t.setAttribute('y', y + 30);
          t.setAttribute('text-anchor', 'middle');
          t.setAttribute('font-size', '12px');
          t.setAttribute('fill', '#000');
          t.textContent = 'C' + (idx + 1);
          svg.appendChild(t);
        });
      }
      vizDiv.appendChild(svg);
    }

    function generateWeightedGraph(numNodes, density, weightRange) {
      const G = {};
      const weights = {};
      for (let i = 0; i < numNodes; i++) {
        G[i] = new Set();
      }
      function randomWeight() {
        const [min, max] = weightRange;
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }
      // Ensure connectivity
      for (let node = 1; node < numNodes; node++) {
        const neighbour = Math.floor(Math.random() * node);
        const w = randomWeight();
        G[node].add(neighbour);
        G[neighbour].add(node);
        weights[`${node}-${neighbour}`] = w;
        weights[`${neighbour}-${node}`] = w;
      }
      for (let i = 0; i < numNodes; i++) {
        for (let j = i + 1; j < numNodes; j++) {
          if (Math.random() < density && !G[i].has(j)) {
            const w = randomWeight();
            G[i].add(j);
            G[j].add(i);
            weights[`${i}-${j}`] = w;
            weights[`${j}-${i}`] = w;
          }
        }
      }
      return { graph: G, weights: weights };
    }

    /* ================== KNN & K-means (IA) ================== */

    // --- KNN (k vecinos más cercanos) ---
    // Este ejercicio fuerza al usuario a ejecutar el algoritmo:
    // 1) calcular distancias (euclídea o Hamming),
    // 2) seleccionar los k vecinos más cercanos,
    // 3) votar la clase.

    const KNN_CATEGORIES = ['Fuerte', 'Normal', 'Débil'];
    const KNN_FEATURE_NAMES = ['Fuerza', 'Velocidad', 'Resistencia', 'Agilidad', 'Tamaño'];

    function round2(x) {
      return Math.round(x * 100) / 100;
    }

    function euclideanDistance2D(p, q) {
      const dx = p.x - q.x;
      const dy = p.y - q.y;
      return Math.hypot(dx, dy);
    }

    function hammingDistance(aFeat, bFeat, featureNames) {
      let d = 0;
      for (const f of featureNames) {
        if (aFeat[f] !== bFeat[f]) d += 1;
      }
      return d;
    }

    /**
     * Generate a random dataset for KNN classification.
     * Depending on the exercise, data may be:
     *  - cuantitativa (2D) -> distancia euclídea
     *  - cualitativa (categorías) -> distancia Hamming
     */
    function generateKNNData(difficulty) {
      // Difficulty controls dataset size and (for qualitative) number of features.
      let numPoints, numClasses, numFeatures;
      if (difficulty === 'easy') {
        numPoints = 6; numClasses = 2; numFeatures = 3;
      } else if (difficulty === 'medium') {
        numPoints = 8; numClasses = 2; numFeatures = 3;
      } else if (difficulty === 'hard') {
        numPoints = 10; numClasses = 3; numFeatures = 4;
      } else {
        numPoints = 12; numClasses = 4; numFeatures = 5;
      }
      const labels = [];
      for (let i = 0; i < numClasses; i++) labels.push(String.fromCharCode(65 + i));

      // Decide metric. Bias slightly towards Euclidean for variety.
      const metric = (Math.random() < 0.6) ? 'euclidean' : 'hamming';

      if (metric === 'euclidean') {
        // Use 1-decimal coordinates to make manual calculation feasible.
        const points = [];
        const classes = {};
        for (let i = 0; i < numPoints; i++) {
          const x = Math.round(Math.random() * 100) / 10; // 0.0..10.0
          const y = Math.round(Math.random() * 100) / 10;
          const label = labels[Math.floor(Math.random() * numClasses)];
          points.push({ id: i, x: x, y: y });
          classes[i] = label;
        }
        const query = { x: Math.round(Math.random() * 100) / 10, y: Math.round(Math.random() * 100) / 10 };
        return { metric, points, classes, query };
      } else {
        const featureNames = KNN_FEATURE_NAMES.slice(0, numFeatures);
        const items = [];
        const classes = {};
        for (let i = 0; i < numPoints; i++) {
          const feats = {};
          for (const f of featureNames) {
            feats[f] = KNN_CATEGORIES[Math.floor(Math.random() * KNN_CATEGORIES.length)];
          }
          const label = labels[Math.floor(Math.random() * numClasses)];
          items.push({ id: i, feats });
          classes[i] = label;
        }
        // Query item
        const qFeats = {};
        for (const f of featureNames) {
          qFeats[f] = KNN_CATEGORIES[Math.floor(Math.random() * KNN_CATEGORIES.length)];
        }
        const query = { feats: qFeats };
        return { metric, items, classes, query, featureNames };
      }
    }

    /**
     * Compute detailed KNN results: distances, ordered neighbors and predicted class.
     * Tie-break: by id ascending (deterministic).
     */
    function computeKNNDetails(data, k = 3) {
      const distances = [];
      if (data.metric === 'euclidean') {
        data.points.forEach(p => {
          distances.push({ id: p.id, dist: euclideanDistance2D(p, data.query) });
        });
      } else {
        data.items.forEach(it => {
          distances.push({ id: it.id, dist: hammingDistance(it.feats, data.query.feats, data.featureNames) });
        });
      }
      distances.sort((a, b) => (a.dist - b.dist) || (a.id - b.id));
      const neighbors = distances.slice(0, Math.min(k, distances.length)).map(d => d.id);

      // Vote
      const votes = {};
      for (const id of neighbors) {
        const lbl = data.classes[id];
        votes[lbl] = (votes[lbl] || 0) + 1;
      }
      // Deterministic tie-break on label
      let bestLabel = null;
      let bestCount = -1;
      const sortedLabels = Object.keys(votes).sort();
      for (const lbl of sortedLabels) {
        if (votes[lbl] > bestCount) {
          bestCount = votes[lbl];
          bestLabel = lbl;
        }
      }

      return { distances, neighbors, predicted: bestLabel };
    }

    /** Initialise a KNN exercise (random mode). */
    function initKNN(difficulty) {
      const data = generateKNNData(difficulty);
      const k = 3;
      const details = computeKNNDetails(data, k);

      currentExercise = {
        type: 'knn',
        metric: data.metric,
        k: k,
        completed: false,

        // Euclidean variant
        points: data.points || null,
        query: data.query || null,

        // Hamming variant
        items: data.items || null,
        featureNames: data.featureNames || null,

        classes: data.classes,

        expectedDistances: details.distances.map(d => ({ id: d.id, dist: (data.metric === 'euclidean' ? round2(d.dist) : d.dist) })),
        expectedNeighbors: details.neighbors,
        // For Euclidean metric, store component-wise differences (dx, dy) rounded to 1 decimal
        expectedDiffs: (data.metric === 'euclidean')
          ? data.points.map(p => {
              const dx = Math.round((p.x - data.query.x) * 10) / 10;
              const dy = Math.round((p.y - data.query.y) * 10) / 10;
              return { id: p.id, dx: dx, dy: dy };
            })
          : null,
        predicted: details.predicted
      };
      updateGraphInfo();
      renderKNN();
      showExercise();
    }

    /** Initialise a KNN exercise in custom mode (euclídeo 2D por simplicidad). */
    function initKNNCustom() {
      const dataStr = document.getElementById('customKNNData').value;
      const queryStr = document.getElementById('customKNNQuery').value;

      const pointParts = dataStr.split(',').map(s => s.trim()).filter(s => s.length > 0);
      const points = [];
      const classes = {};
      let id = 0;
      for (const part of pointParts) {
        const comps = part.split('-');
        if (comps.length < 3) continue;
        const x = parseFloat(comps[0]);
        const y = parseFloat(comps[1]);
        const label = comps.slice(2).join('-');
        points.push({ id: id, x: x, y: y });
        classes[id] = label;
        id++;
      }
      const queryComps = queryStr.split('-').map(s => parseFloat(s.trim()));
      const query = { x: queryComps[0], y: queryComps[1] };
      if (points.length === 0 || points.some(p => isNaN(p.x) || isNaN(p.y)) || isNaN(query.x) || isNaN(query.y)) {
        alert('Revisa el formato: puntos "x-y-clase" separados por comas y punto de consulta "x-y".');
        return;
      }

      const data = { metric: 'euclidean', points, classes, query };
      const k = 3;
      const details = computeKNNDetails(data, k);

      currentExercise = {
        type: 'knn',
        metric: 'euclidean',
        k: k,
        completed: false,
        points: points,
        query: query,
        items: null,
        featureNames: null,
        classes: classes,
        expectedDistances: details.distances.map(d => ({ id: d.id, dist: round2(d.dist) })),
        expectedNeighbors: details.neighbors,
        // For custom Euclidean KNN, store component-wise differences between each point and the query
        expectedDiffs: points.map(p => {
          const dx = Math.round((p.x - query.x) * 10) / 10;
          const dy = Math.round((p.y - query.y) * 10) / 10;
          return { id: p.id, dx: dx, dy: dy };
        }),
        predicted: details.predicted
      };
      updateGraphInfo();
      renderKNN();
      showExercise();
    }

      function parseNeighborIds(text) {
        if (!text) return [];
        return text.split(',').map(s => s.trim()).filter(s => s.length > 0).map(x => parseInt(x) - 1).filter(x => !isNaN(x)); // ids shown 1-based
      }

      function sameSet(a, b) {
        if (a.length !== b.length) return false;
        const sa = new Set(a);
        const sb = new Set(b);
        if (sa.size !== sb.size || sb.size !== b.length) return false;
        for (const x of sa) if (!sb.has(x)) return false;
        return true;
      }

      btn.addEventListener('click', () => {
        let ok = true;

        // 1) Component-wise differences (only for Euclidean metric)
        if (state.metric === 'euclidean' && state.expectedDiffs) {
          for (const diff of state.expectedDiffs) {
            // dx
            const inpDx = dxInputs[diff.id];
            const rawDx = (inpDx && inpDx.value || '').trim().replace(',', '.');
            const valDx = parseFloat(rawDx);
            if (isNaN(valDx) || Math.abs(valDx - diff.dx) > 0.05) {
              ok = false;
              if (inpDx) inpDx.style.borderColor = 'red';
            } else {
              inpDx.style.borderColor = 'green';
            }
            // dy
            const inpDy = dyInputs[diff.id];
            const rawDy = (inpDy && inpDy.value || '').trim().replace(',', '.');
            const valDy = parseFloat(rawDy);
            if (isNaN(valDy) || Math.abs(valDy - diff.dy) > 0.05) {
              ok = false;
              if (inpDy) inpDy.style.borderColor = 'red';
            } else {
              inpDy.style.borderColor = 'green';
            }
          }
        }

        // 2) Distances
        for (const exp of state.expectedDistances) {
          const inp = distInputs[exp.id];
          const raw = (inp.value || '').trim().replace(',', '.');
          let val = (state.metric === 'euclidean') ? parseFloat(raw) : parseInt(raw);
          if (isNaN(val)) {
            ok = false;
            inp.style.borderColor = 'red';
            continue;
          }
          const expected = exp.dist;
          if (state.metric === 'euclidean') {
            // Accept either exact rounding to 2 decimals or close within 0.05
            if (Math.abs(val - expected) > 0.05) {
              ok = false;
              inp.style.borderColor = 'red';
            } else {
              inp.style.borderColor = 'green';
            }
          } else {
            if (val !== expected) {
              ok = false;
              inp.style.borderColor = 'red';
            } else {
              inp.style.borderColor = 'green';
            }
          }
        }

        // 3) Neighbors
        const userNeighbors = parseNeighborIds(neighInp.value);
        const expectedNeighbors = state.expectedNeighbors;
        if (!sameSet(userNeighbors, expectedNeighbors)) {
          ok = false;
          neighInp.style.borderColor = 'red';
        } else {
          neighInp.style.borderColor = 'green';
        }

        // 4) Prediction
        const pred = predSelect.value;
        if (pred !== state.predicted) {
          ok = false;
          predSelect.style.borderColor = 'red';
        } else {
          predSelect.style.borderColor = 'green';
        }

        if (ok) {
          msg.style.color = 'green';
          msg.textContent = '¡Correcto! Has ejecutado KNN: distancias → vecinos → voto.';
          state.completed = true;
          renderKNN();
        } else {
          msg.style.color = 'red';
          msg.textContent = 'Hay errores. Revisa los campos marcados en rojo.';
        }
      });

      // Solve button: reveal the full solution filling the table
      const solveBtn = document.createElement('button');
      solveBtn.textContent = 'Resolver';
      solveBtn.style.marginLeft = '10px';
      contentDiv.appendChild(solveBtn);
      solveBtn.addEventListener('click', () => {
        // Fill distances
        state.expectedDistances.forEach(exp => {
          const inp = distInputs[exp.id];
          if (inp) {
            if (state.metric === 'euclidean') {
              inp.value = exp.dist.toFixed(2);
            } else {
              inp.value = exp.dist;
            }
            inp.style.borderColor = 'green';
          }
        });
        // Fill component differences if Euclidean
        if (state.metric === 'euclidean' && state.expectedDiffs) {
          state.expectedDiffs.forEach(diff => {
            const inpDx = dxInputs[diff.id];
            const inpDy = dyInputs[diff.id];
            if (inpDx) {
              inpDx.value = diff.dx.toFixed(1);
              inpDx.style.borderColor = 'green';
            }
            if (inpDy) {
              inpDy.value = diff.dy.toFixed(1);
              inpDy.style.borderColor = 'green';
            }
          });
        }
        neighInp.value = state.expectedNeighbors.map(i => i + 1).join(', ');
        neighInp.style.borderColor = 'green';
        predSelect.value = state.predicted;
        predSelect.style.borderColor = 'green';
        msg.style.color = 'green';
        msg.textContent = 'Solución mostrada. Ejercicio completado.';
        state.completed = true;
        renderKNN();
      });
    }

    // --- End KNN ---

function computeKMeansSteps(points, k, maxIters) {
      const shuffle = points.slice().sort(() => Math.random() - 0.5);
      let centroids = [];
      for (let i = 0; i < k; i++) {
        centroids.push({ x: shuffle[i].x, y: shuffle[i].y });
      }
      const steps = [];
      for (let iter = 0; iter < maxIters; iter++) {
        const assignments = {};
        for (const p of points) {
          let bestIdx = 0;
          let bestDist = Infinity;
          for (let i = 0; i < k; i++) {
            const c = centroids[i];
            const dx = p.x - c.x;
            const dy = p.y - c.y;
            const dist = dx * dx + dy * dy;
            if (dist < bestDist) {
              bestDist = dist;
              bestIdx = i;
            }
          }
          assignments[p.id] = bestIdx;
        }
        steps.push({ centroids: centroids.map(c => ({ x: c.x, y: c.y })), assignments: Object.assign({}, assignments) });
        const sums = Array(k).fill(null).map(() => ({ sumX: 0, sumY: 0, count: 0 }));
        for (const p of points) {
          const idx = assignments[p.id];
          sums[idx].sumX += p.x;
          sums[idx].sumY += p.y;
          sums[idx].count++;
        }
        for (let i = 0; i < k; i++) {
          if (sums[i].count > 0) {
            centroids[i] = { x: sums[i].sumX / sums[i].count, y: sums[i].sumY / sums[i].count };
          }
        }
      }
      return steps;
    }

    /** Generate random dataset and steps for K-means. */
    function generateKMeansData(difficulty) {
      let numPoints;
      let k;
      let maxIters;
      if (difficulty === 'easy') {
        // Para K‑means permitimos más iteraciones que la dificultad original.  
        // Esto garantiza que siempre haya suficientes pasos para que el usuario
        // pueda realizar al menos dos iteraciones y, si las asignaciones siguen
        // cambiando, continuar hasta que converjan o se alcance un máximo
        // razonable.  Los valores superiores permiten observar varias
        // actualizaciones de los centroides.
        numPoints = 6;
        k = 2;
        maxIters = 6;
      } else if (difficulty === 'medium') {
        numPoints = 8;
        k = 2;
        maxIters = 8;
      } else if (difficulty === 'hard') {
        numPoints = 10;
        k = 3;
        maxIters = 8;
      } else {
        // "Muy difícil" – mayor número de puntos y centroides y más iteraciones
        numPoints = 12;
        k = 4;
        maxIters = 10;
      }
      const points = [];
      for (let i = 0; i < numPoints; i++) {
        // Round to 2 decimals so the values shown are exactly the values used
        const x = Math.round(Math.random() * 1000) / 100;
        const y = Math.round(Math.random() * 1000) / 100;
        points.push({ id: i, x: x, y: y });
      }
      const steps = computeKMeansSteps(points, k, maxIters);
      return { points, k, steps };
    }

    /** Initialise K-means exercise (random mode). */
    function initKMeans(difficulty) {
      const data = generateKMeansData(difficulty);
      // Enriquecemos cada paso de K‑means con las diferencias
      // componente‑a‑componente y distancias contra cada centroide.  Estas
      // estructuras permitirán construir tablas detalladas similares a las de
      // KNN para que el usuario introduzca los valores de dx, dy y la
      // distancia euclídea para cada punto y centroide.
      data.steps.forEach(step => {
        step.expectedDiffs = [];
        for (const p of data.points) {
          for (let j = 0; j < data.k; j++) {
            const c = step.centroids[j];
            const dx = p.x - c.x;
            const dy = p.y - c.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            step.expectedDiffs.push({ id: p.id, centroid: j, dx: dx, dy: dy, dist: dist });
          }
        }
      });
      // Calculamos un historial de cambios de asignación.  El primer paso se
      // marca como cambiado por defecto.  A partir del segundo, se compara
      // con el paso anterior para comprobar si al menos un punto ha cambiado
      // de centroide.  Este vector se utiliza para determinar cuándo
      // solicitar una iteración adicional al usuario.
      const changedFlags = [];
      for (let i = 0; i < data.steps.length; i++) {
        if (i === 0) {
          changedFlags.push(true);
        } else {
          const prev = data.steps[i - 1].assignments;
          const curr = data.steps[i].assignments;
          let changed = false;
          for (const id in curr) {
            if (curr[id] !== prev[id]) {
              changed = true;
              break;
            }
          }
          changedFlags.push(changed);
        }
      }
      currentExercise = {
        type: 'kmeans',
        points: data.points,
        k: data.k,
        steps: data.steps,
        idx: 0,
        completed: false,
        changedFlags: changedFlags,
        // Número de iteraciones de interfaz ya renderizadas.  Se utiliza para
        // mantener las tablas de las iteraciones anteriores al añadir nuevas
        // iteraciones sin borrar la interfaz.
        renderedIterations: 0,
        // Indica si el resumen final ya ha sido mostrado.  Evita añadir
        // múltiples mensajes finales.
        finalRendered: false
      };
      updateGraphInfo();
      renderKMeans();
      showExercise();
    }

    /** Initialise K-means exercise in custom mode. */
    function initKMeansCustom() {
      const dataStr = document.getElementById('customKMeansData').value;
      const kVal = parseInt(document.getElementById('customK').value);
      const parts = dataStr.split(',').map(s => s.trim()).filter(s => s.length > 0);
      const points = [];
      let id = 0;
      for (const part of parts) {
        const comps = part.split('-');
        if (comps.length < 2) continue;
        const x = parseFloat(comps[0]);
        const y = parseFloat(comps[1]);
        if (isNaN(x) || isNaN(y)) continue;
        points.push({ id: id++, x: x, y: y });
      }
      if (isNaN(kVal) || kVal < 1 || points.length < kVal) {
        alert('Introduce al menos tantos puntos válidos (formato "x-y") como clusters k.');
        return;
      }
      // Permitimos hasta 10 iteraciones para modo personalizado, lo que
      // proporciona suficientes pasos para observar la convergencia si se
      // producen cambios en las asignaciones.
      const maxIters = 10;
      const steps = computeKMeansSteps(points, kVal, maxIters);
      // Calculamos diferencias esperadas y banderas de cambio igual que en
      // el modo aleatorio.
      steps.forEach(step => {
        step.expectedDiffs = [];
        for (const p of points) {
          for (let j = 0; j < kVal; j++) {
            const c = step.centroids[j];
            const dx = p.x - c.x;
            const dy = p.y - c.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            step.expectedDiffs.push({ id: p.id, centroid: j, dx: dx, dy: dy, dist: dist });
          }
        }
      });
      const changedFlags = [];
      for (let i = 0; i < steps.length; i++) {
        if (i === 0) {
          changedFlags.push(true);
        } else {
          const prev = steps[i - 1].assignments;
          const curr = steps[i].assignments;
          let changed = false;
          for (const id in curr) {
            if (curr[id] !== prev[id]) {
              changed = true;
              break;
            }
          }
          changedFlags.push(changed);
        }
      }
      currentExercise = {
        type: 'kmeans',
        points: points,
        k: kVal,
        steps: steps,
        idx: 0,
        completed: false,
        changedFlags: changedFlags,
        // Número de iteraciones de interfaz ya renderizadas para mantener
        // las tablas de iteraciones anteriores visibles.
        renderedIterations: 0,
        // Indicador para evitar mostrar múltiples veces el resumen final.
        finalRendered: false
      };
      updateGraphInfo();
      renderKMeans();
      showExercise();
    }

    /** Render K-means interaction step-by-step. */
    function renderKMeans() {
      const contentDiv = document.getElementById('algorithmContent');
      const state = currentExercise;
      // Al inicio de un ejercicio (sin iteraciones renderizadas) limpiamos el área de contenido. Si ya
      // se han renderizado iteraciones, mantenemos el contenido para que los pasos previos sean visibles.
      if (state.renderedIterations === 0 && state.idx === 0 && !state.completed) {
        contentDiv.innerHTML = '';
      }
      // Si el ejercicio ya se ha completado, mostramos los clusters finales una sola vez
      if (state.completed) {
        // Determinamos el paso final a mostrar.  Si el índice supera el número de pasos
        // disponibles, usamos el último.
        const finalIdx = (state.idx >= state.steps.length) ? state.steps.length - 1 : state.idx;
        const finalStep = state.steps[finalIdx];
        // Dibujamos los puntos coloreados por su cluster final y los centroides correspondientes
        drawScatter(state.points, { assignments: finalStep.assignments, centroids: finalStep.centroids });
        // Solo añadimos el resumen final si aún no se ha añadido
        if (!state.finalRendered) {
          const clusters = {};
          for (const id in finalStep.assignments) {
            const cl = finalStep.assignments[id];
            if (!clusters[cl]) clusters[cl] = [];
            clusters[cl].push(parseInt(id));
          }
          const p = document.createElement('p');
          p.innerHTML = '<strong>Ejercicio completado.</strong><br/>Clusters finales:<br/>';
          for (const c in clusters) {
            p.innerHTML += 'Cluster C' + (Number(c) + 1) + ': ' + clusters[c].sort((a,b) => a - b).map(i => i + 1).join(', ') + '<br/>';
          }
          contentDiv.appendChild(p);
          state.finalRendered = true;
        }
        return;
      }
      // Renderizado de iteración interactiva de K-means: cálculo de distancias y asignación
      const idx = state.idx;
      const step = state.steps[idx];
      // Dibujamos los centroides de la iteración actual (sin mostrar asignaciones)
      drawScatter(state.points, { centroids: step.centroids });
      // Si esta iteración aún no ha sido renderizada, creamos su interfaz y la añadimos
      if (state.renderedIterations <= idx) {
        // Contenedor para la iteración
        const iterDiv = document.createElement('div');
        iterDiv.className = 'kmeans-iteration';
        // Instrucciones
        const pInstr = document.createElement('p');
        pInstr.innerHTML = '<strong>Iteración ' + (idx + 1) + '</strong>. Completa las distancias a cada centroide y asigna cada punto al cluster (C1 a C' + state.k + ').';
        iterDiv.appendChild(pInstr);
        // Mostramos las coordenadas de los centroides de esta iteración (sin ellas
        // no se pueden calcular dx, dy ni las distancias).
        const pCent = document.createElement('p');
        const centTxt = step.centroids.map((c, j) => 'C' + (j + 1) + ' = (' + (Math.round(c.x * 100) / 100).toFixed(2) + ', ' + (Math.round(c.y * 100) / 100).toFixed(2) + ')').join(' · ');
        pCent.innerHTML = (idx === 0
          ? 'Centroides iniciales (puntos elegidos al azar): '
          : 'Centroides recalculados (media de los puntos de cada cluster en la iteración anterior): ') + centTxt;
        iterDiv.appendChild(pCent);
        // Construimos la tabla de distancias.
        const tbl = document.createElement('table');
        const head = document.createElement('tr');
        ['Punto', 'x', 'y'].forEach(h => {
          const th = document.createElement('th');
          th.textContent = h;
          head.appendChild(th);
        });
        for (let j = 0; j < state.k; j++) {
          ['dx C' + (j + 1), 'dy C' + (j + 1), 'dist C' + (j + 1)].forEach(h => {
            const th = document.createElement('th');
            th.textContent = h;
            head.appendChild(th);
          });
        }
        const thAssign = document.createElement('th');
        thAssign.textContent = 'Cluster asignado';
        head.appendChild(thAssign);
        tbl.appendChild(head);
        // Estructuras de referencia para inputs y selects
        const diffInputs = {};
        const selectInputs = {};
        // Filas de la tabla
        state.points.forEach(pt => {
          const tr = document.createElement('tr');
          const tdId = document.createElement('td');
          tdId.textContent = pt.id + 1;
          tr.appendChild(tdId);
          const tdX = document.createElement('td');
          tdX.textContent = pt.x.toFixed(2);
          tr.appendChild(tdX);
          const tdY = document.createElement('td');
          tdY.textContent = pt.y.toFixed(2);
          tr.appendChild(tdY);
          diffInputs[pt.id] = {};
          for (let j = 0; j < state.k; j++) {
            const tdDx = document.createElement('td');
            const inpDx = document.createElement('input');
            inpDx.type = 'text';
            inpDx.size = 6;
            inpDx.placeholder = 'dx';
            tdDx.appendChild(inpDx);
            tr.appendChild(tdDx);
            const tdDy = document.createElement('td');
            const inpDy = document.createElement('input');
            inpDy.type = 'text';
            inpDy.size = 6;
            inpDy.placeholder = 'dy';
            tdDy.appendChild(inpDy);
            tr.appendChild(tdDy);
            const tdDist = document.createElement('td');
            const inpDist = document.createElement('input');
            inpDist.type = 'text';
            inpDist.size = 8;
            inpDist.placeholder = 'dist';
            tdDist.appendChild(inpDist);
            tr.appendChild(tdDist);
            diffInputs[pt.id][j] = { dx: inpDx, dy: inpDy, dist: inpDist };
          }
          const tdSel = document.createElement('td');
          const sel = document.createElement('select');
          for (let j = 0; j < state.k; j++) {
            const opt = document.createElement('option');
            opt.value = j;
            opt.textContent = 'C' + (j + 1);
            sel.appendChild(opt);
          }
          tdSel.appendChild(sel);
          tr.appendChild(tdSel);
          tbl.appendChild(tr);
          selectInputs[pt.id] = sel;
        });
        iterDiv.appendChild(tbl);
        // Botones y mensaje
        const btnCheck = document.createElement('button');
        btnCheck.textContent = 'Corregir';
        btnCheck.style.marginTop = '10px';
        iterDiv.appendChild(btnCheck);
        const msg = document.createElement('div');
        msg.className = 'message';
        iterDiv.appendChild(msg);
        const btnSolve = document.createElement('button');
        btnSolve.textContent = 'Resolver';
        btnSolve.style.marginLeft = '10px';
        iterDiv.appendChild(btnSolve);
        // Función auxiliar para marcar inputs
        function markInput(input, ok) {
          input.style.borderColor = ok ? 'green' : 'red';
        }
        // Evento de corrección
        btnCheck.addEventListener('click', () => {
          let ok = true;
          // Validar dx, dy y distancias
          for (const exp of step.expectedDiffs) {
            const idp = exp.id;
            const cIdx = exp.centroid;
            const inputs = diffInputs[idp][cIdx];
            const rawDx = (inputs.dx.value || '').trim().replace(',', '.');
            const valDx = parseFloat(rawDx);
            if (isNaN(valDx) || Math.abs(valDx - exp.dx) > 0.05) {
              ok = false;
              markInput(inputs.dx, false);
            } else {
              markInput(inputs.dx, true);
            }
            const rawDy = (inputs.dy.value || '').trim().replace(',', '.');
            const valDy = parseFloat(rawDy);
            if (isNaN(valDy) || Math.abs(valDy - exp.dy) > 0.05) {
              ok = false;
              markInput(inputs.dy, false);
            } else {
              markInput(inputs.dy, true);
            }
            const rawDist = (inputs.dist.value || '').trim().replace(',', '.');
            const valDist = parseFloat(rawDist);
            if (isNaN(valDist) || Math.abs(valDist - exp.dist) > 0.05) {
              ok = false;
              markInput(inputs.dist, false);
            } else {
              markInput(inputs.dist, true);
            }
          }
          // Validar asignaciones
          for (const idp in step.assignments) {
            const expected = step.assignments[idp];
            const userVal = parseInt(selectInputs[idp].value);
            if (userVal !== expected) {
              ok = false;
              selectInputs[idp].style.borderColor = 'red';
            } else {
              selectInputs[idp].style.borderColor = 'green';
            }
          }
          if (ok) {
            msg.style.color = 'green';
            msg.textContent = '¡Correcto! Las distancias y asignaciones son adecuadas.';
            // Determinamos si seguir o finalizar en función de las banderas de cambio
            if (idx === 0) {
              state.idx++;
              if (state.idx >= state.steps.length) {
                state.completed = true;
              }
              renderKMeans();
              return;
            }
            const ch1 = state.changedFlags[idx];
            const ch0 = state.changedFlags[idx - 1];
            if (ch1 && ch0) {
              // Continuamos con la siguiente iteración automáticamente
              state.idx++;
              if (state.idx >= state.steps.length) {
                state.completed = true;
              }
              renderKMeans();
            } else {
              // Convergencia alcanzada
              state.completed = true;
              renderKMeans();
            }
          } else {
            msg.style.color = 'red';
            msg.textContent = 'Hay errores. Revisa los campos marcados en rojo.';
          }
        });
        // Evento de resolver
        btnSolve.addEventListener('click', () => {
          // Autocompletamos todos los valores esperados
          for (const exp of step.expectedDiffs) {
            const idp = exp.id;
            const cIdx = exp.centroid;
            const inputs = diffInputs[idp][cIdx];
            inputs.dx.value = exp.dx.toFixed(2);
            inputs.dy.value = exp.dy.toFixed(2);
            inputs.dist.value = exp.dist.toFixed(2);
            markInput(inputs.dx, true);
            markInput(inputs.dy, true);
            markInput(inputs.dist, true);
          }
          for (const idp in step.assignments) {
            selectInputs[idp].value = step.assignments[idp];
            selectInputs[idp].style.borderColor = 'green';
          }
          msg.style.color = 'green';
          msg.textContent = 'Solución mostrada.';
          // Lógica de avance similar al caso correcto
          if (idx === 0) {
            state.idx++;
            if (state.idx >= state.steps.length) {
              state.completed = true;
            }
            renderKMeans();
            return;
          }
          const ch1 = state.changedFlags[idx];
          const ch0 = state.changedFlags[idx - 1];
          if (ch1 && ch0) {
            state.idx++;
            if (state.idx >= state.steps.length) {
              state.completed = true;
            }
            renderKMeans();
          } else {
            state.completed = true;
            renderKMeans();
          }
        });
        // Añadimos la iteración al área de contenido

    /**
     * Initialize a forward chaining exercise with a simple set of rules and facts.
     * The exercise asks the learner to fill a conflict-resolution table.
     */
    function initForward(difficulty = 'medium') {
      // Generate a random forward chaining exercise based on the chosen difficulty

    /** Compute forward chaining iterations with conflict resolution criteria. */
    function computeForwardSteps(rules, dbInit) {
      const steps = [];
      let db = dbInit.slice();
      const recency = {};
      db.forEach(f => { recency[f] = 0; });
      let iteration = 0;
      while (true) {
        // Determine conflict set: all rules whose premises are satisfied and conclusion not in DB
        const cc = [];
        rules.forEach(rule => {
          if (!db.includes(rule.conclusion)) {
            const applicable = rule.conditions.every(cond => db.includes(cond));
            if (applicable) cc.push(rule);
          }
        });
        const ccNames = cc.map(r => r.name);
        const conflict = cc.length > 1;
        let criterion = '-';
        let chosenRule = null;
        if (cc.length === 0) {
          // No applicable rules; record final row and break
          steps.push({ cc: ccNames, conflict: false, criterion: '-', rule: '-', newGoal: '-', db: db.slice() });
          break;
        } else if (cc.length === 1) {
          chosenRule = cc[0];
        } else {
          // Apply specificity > recencia > textual order
          let maxLen = Math.max(...cc.map(r => r.conditions.length));
          let candidates = cc.filter(r => r.conditions.length === maxLen);
          if (candidates.length === 1) {
            chosenRule = candidates[0];
            criterion = 'especificidad';
          } else {
            let bestCandidates = [];
            let bestRec = -Infinity;
            candidates.forEach(rule => {
              let minRec = Math.min(...rule.conditions.map(c => recency[c] !== undefined ? recency[c] : -1));
              if (minRec > bestRec) {
                bestRec = minRec;
                bestCandidates = [rule];
              } else if (minRec === bestRec) {
                bestCandidates.push(rule);
              }
            });
            if (bestCandidates.length === 1) {
              chosenRule = bestCandidates[0];
              criterion = 'recencia';
            } else {
              chosenRule = bestCandidates[0]; // textual order among the rules still tied after recency
              criterion = 'orden textual';
            }
          }
        }
        const chosenName = chosenRule.name;
        const newGoal = chosenRule.conclusion;
        steps.push({ cc: ccNames, conflict: conflict, criterion: criterion, rule: chosenName, newGoal: newGoal, db: db.slice() });
        // apply rule
        db.push(chosenRule.conclusion);
        recency[chosenRule.conclusion] = iteration + 1;
        iteration++;
      }
      return steps;
    }

    /** Initialize backward chaining exercise. */
    function initBackward(difficulty = 'medium') {

    /**
     * Compute backward chaining steps (depth-first, with backtracking).
     * A goal is added to the fact base only once every sub-goal of the chosen rule
     * has been proved.  If a sub-goal cannot be proved, the rule is discarded and
     * the next rule of the conflict set is tried (a new row is recorded).
     * Each row: { goal, cc, criterion, rule, newGoals, db } where db is the fact
     * base at the moment the row is processed.  The returned array has an extra
     * boolean property `proven` telling whether the initial goal was proved.
     */
    function computeBackwardSteps(rules, goal, dbInit) {
      const steps = [];
      const db = dbInit.slice();
      // Recency of facts: initial facts 0, then 1, 2, ... as they are proved
      const recency = {};
      db.forEach(f => { recency[f] = 0; });
      let clock = 0;
      const MAX_STEPS = 100; // safeguard

      // Conflict resolution: especificidad > recencia > orden textual
      function choose(cands) {
        if (cands.length === 1) return { rule: cands[0], criterion: '-' };
        const maxLen = Math.max(...cands.map(r => r.conditions.length));
        const candidates = cands.filter(r => r.conditions.length === maxLen);
        if (candidates.length === 1) return { rule: candidates[0], criterion: 'especificidad' };
        let bestCandidates = [];
        let bestRec = -Infinity;
        candidates.forEach(rule => {
          const minRec = Math.min(...rule.conditions.map(c => recency[c] !== undefined ? recency[c] : -1));
          if (minRec > bestRec) {
            bestRec = minRec;
            bestCandidates = [rule];
          } else if (minRec === bestRec) {
            bestCandidates.push(rule);
          }
        });
        if (bestCandidates.length === 1) return { rule: bestCandidates[0], criterion: 'recencia' };
        return { rule: bestCandidates[0], criterion: 'orden textual' };
      }

      function prove(g, stack) {
        if (steps.length >= MAX_STEPS) return false;
        if (db.includes(g)) {
          // Already in the fact base
          steps.push({ goal: g, cc: [], criterion: '-', rule: '-', newGoals: [], db: db.slice() });
          return true;
        }
        let cands = stack.has(g) ? [] : rules.filter(r => r.conclusion === g); // avoid cycles
        if (cands.length === 0) {
          // No rule concludes this goal: it cannot be proved
          steps.push({ goal: g, cc: [], criterion: '-', rule: '-', newGoals: [], db: db.slice() });
          return false;
        }
        while (cands.length > 0) {
          const { rule, criterion } = choose(cands);
          const newGoals = rule.conditions.filter(c => !db.includes(c));
          steps.push({ goal: g, cc: cands.map(r => r.name), criterion: criterion, rule: rule.name, newGoals: newGoals.slice(), db: db.slice() });
          stack.add(g);
          let ok = true;
          for (const sg of newGoals) {
            if (!prove(sg, stack)) { ok = false; break; }
          }
          stack.delete(g);
          if (ok) {
            db.push(g);
            clock++;
            recency[g] = clock;
            return true;
          }
          // Backtracking: discard this rule and try the remaining ones
          cands = cands.filter(r => r !== rule);
          if (steps.length >= MAX_STEPS) return false;
        }
        return false;
      }

      const proven = prove(goal, new Set());
      steps.proven = proven;
      steps.finalDb = db.slice();
      return steps;
    }

    /**
     * Parse a multiline string of rules into an array of rule objects.
     * Each line should be of the form "A B -> C" or "A,B→C". Conditions are separated by
     * spaces, commas, ^ or ∧. Leading/trailing spaces are ignored. Letters are converted to uppercase.
     * @param {string} ruleStr raw rules string
     * @returns {Array} array of rule objects { name: 'R1', conditions: [...], conclusion: letter }
     */
    function parseCustomRules(ruleStr) {
      const lines = ruleStr.split(/\n|;/).map(l => l.trim()).filter(l => l.length > 0);
      const rules = [];
      let counter = 1;
      lines.forEach(line => {
        // Normalize arrow: replace unicode arrow → with ->
        let txt = line.replace(/→/g, '->');
        const parts = txt.split(/->/);
        if (parts.length >= 2) {
          const lhs = parts[0].trim();
          const rhs = parts.slice(1).join('->').trim();
          // Conditions: split by ^, ∧, comma or whitespace
          const conds = lhs.replace(/[,∧\^]/g, ' ').split(/\s+/).filter(c => c.length > 0).map(c => c.toUpperCase());
          // Only keep single-letter uppercase facts as conclusion
          // If multiple tokens, take first
          let concl = rhs.split(/[\s,]/).filter(t => t.length > 0)[0] || '';
          concl = concl.toUpperCase();
          if (conds.length > 0 && concl) {
            rules.push({ name: 'R' + counter, conditions: conds, conclusion: concl });
            counter++;
          }
        }
      });
      return rules;
    }

    /**
     * Parse a string of initial facts into an array of uppercase letters.
     * Accepts letters separated by commas or whitespace. Non-letters are discarded.
     * @param {string} factsStr raw facts string
     * @returns {Array} array of facts (strings)
     */
    function parseCustomFacts(factsStr) {
      return factsStr
        .replace(/[,]/g, ' ')
        .split(/\s+/)
        .map(s => s.trim().toUpperCase())
        .filter(s => s.length > 0);
    }

    /**
     * Initialise a forward chaining exercise from user-specified rules and facts.
     * @param {string} ruleStr raw rules input
     * @param {string} factsStr raw facts input

    function initForwardCustom(ruleStr, factsStr) {
      const rules = parseCustomRules(ruleStr);
      const initialDB = parseCustomFacts(factsStr);
      // If no rules specified, default to a random exercise using default difficulty
      if (rules.length === 0) {
        initForward('easy');
        return;
      }
      // Compute steps with conflict resolution
      const steps = computeForwardSteps(rules, initialDB);
      currentExercise = {
        type: 'forward',
        rules: rules,
        db0: initialDB,
        steps: steps,
        idx: 0
      };
      updateGraphInfo();
      renderForward();
      showExercise();
    }

    function initBackwardCustom(ruleStr, factsStr, goalStr) {

      currentExercise = {

        rules: rules,
        db0: initialDB,
        goal: goal,
        steps: steps,
        idx: 0
      };
      updateGraphInfo();
      renderBackward();
      showExercise();
    }

    /**
     * Generates random weights and input values for the simple neural network exercise
     * consisting of two input variables (x, y), three hidden neurons (h0, h1, h2)
     * and one output neuron (z).  The weight ranges and the number of input
     * pairs depend on the selected difficulty.  Returns an object with
     * weights and precomputed data rows.
     * @param {string} difficulty difficulty level ('easy', 'medium', 'hard', 'veryhard')
     */
    function generateNeuralData(difficulty) {
      let nRows, rangeW, rangeXY;
      switch (difficulty) {
        case 'easy':
          nRows = 3; rangeW = 2; rangeXY = 3; break;
        case 'medium':
          nRows = 4; rangeW = 3; rangeXY = 4; break;
        case 'hard':
          nRows = 5; rangeW = 4; rangeXY = 5; break;
        case 'veryhard':
          nRows = 5; rangeW = 5; rangeXY = 6; break;
        default:
          nRows = 4; rangeW = 3; rangeXY = 4;
      }
      // Helper to draw a random integer in [-range, range]
      function rnd(range) {
        return Math.floor(Math.random() * (2 * range + 1)) - range;
      }
      // Generate weight matrix for x, y and z connections to h0/h1/h2
      const weights = {
        x: { h0: rnd(rangeW), h1: rnd(rangeW), h2: rnd(rangeW) },
        y: { h0: rnd(rangeW), h1: rnd(rangeW), h2: rnd(rangeW) },
        z: { h0: rnd(rangeW), h1: rnd(rangeW), h2: rnd(rangeW) }
      };
      // Ensure not all weights are zero to avoid trivial networks
      const allZero = Object.values(weights.x).concat(Object.values(weights.y), Object.values(weights.z)).every(w => w === 0);
      if (allZero) {
        weights.x.h0 = 1;
      }
      // Generate random input pairs and compute outputs
      const data = [];
      for (let i = 0; i < nRows; i++) {
        const xv = rnd(rangeXY);
        const yv = rnd(rangeXY);
        const h0 = weights.x.h0 * xv + weights.y.h0 * yv;
        const h1 = weights.x.h1 * xv + weights.y.h1 * yv;
        const h2 = weights.x.h2 * xv + weights.y.h2 * yv;
        const z = weights.z.h0 * h0 + weights.z.h1 * h1 + weights.z.h2 * h2;
        data.push({ x: xv, y: yv, h0: h0, h1: h1, h2: h2, z: z });
      }
      return { weights: weights, data: data };
    }
